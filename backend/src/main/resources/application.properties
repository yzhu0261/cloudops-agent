spring.application.name=cloudops-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/cloudops_db
spring.datasource.username=${DB_USERNAME:cloudops}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-4.1-mini

# Ollama Local AI
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:4b
spring.ai.ollama.chat.options.temperature=0.2

# Automatic Monitoring
cloudops.monitoring.enabled=true
cloudops.monitoring.interval-ms=60000
cloudops.monitoring.functions=SaveWorkout

# Automatic Investigation
cloudops.investigation.enabled=true
cloudops.investigation.interval-ms=30000
